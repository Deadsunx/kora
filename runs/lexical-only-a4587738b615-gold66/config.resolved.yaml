agent:
  decompose: true
  enabled: false
  keep_original: true
  max_new_tokens: 128
  max_steps: 2
  max_subquestions: 3
  verify: false
chunking:
  max_tokens: 512
  min_tokens: 32
  overlap_tokens: 64
  strategy: structural
description: BM25 with French tokenisation, no dense retrieval.
embedding:
  batch_size: 32
  device: auto
  model_name: intfloat/multilingual-e5-base
  normalize: true
  passage_prefix: 'passage: '
  query_prefix: 'query: '
eval:
  dataset_path: data/eval/gold_qa.jsonl
  judge_model: null
  recall_at_k:
  - 1
  - 3
  - 5
  - 10
  - 20
  seed: 42
generator:
  adapter_path: null
  allow_abstention: true
  max_new_tokens: 512
  max_passage_chars: 1200
  model_name: Qwen/Qwen3-4B-Instruct-2507
  quantization: 4bit
  temperature: 0.0
name: lexical-only
reranker:
  batch_size: 32
  enabled: false
  max_length: 512
  model_name: BAAI/bge-reranker-v2-m3
  precision: fp16
retrieval:
  bm25: true
  dense: false
  final_k: 5
  rrf_k: 60
  top_k: 20
