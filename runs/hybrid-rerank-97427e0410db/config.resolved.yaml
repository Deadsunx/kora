chunking:
  max_tokens: 512
  min_tokens: 32
  overlap_tokens: 64
  strategy: structural
description: Dense + BM25 + cross-encoder reranking over a wider candidate pool.
embedding:
  batch_size: 32
  device: auto
  model_name: intfloat/multilingual-e5-base
  normalize: true
  passage_prefix: 'passage: '
  query_prefix: 'query: '
eval:
  dataset_path: data/eval/gold_qa.jsonl
  judge_model: null
  recall_at_k:
  - 1
  - 3
  - 5
  - 10
  - 20
  seed: 42
generator:
  adapter_path: null
  allow_abstention: true
  max_new_tokens: 512
  model_name: Qwen/Qwen3-4B-Instruct
  quantization: 4bit
  temperature: 0.0
name: hybrid-rerank
reranker:
  batch_size: 16
  enabled: true
  model_name: BAAI/bge-reranker-v2-m3
retrieval:
  bm25: true
  dense: true
  final_k: 5
  rrf_k: 60
  top_k: 50
