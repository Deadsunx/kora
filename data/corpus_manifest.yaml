    adopted: 2017-11-23
    title: Acte uniforme relatif au droit de l'arbitrage
    domain: arbitrage
    status: in_force
    supersedes: AUA-1999
    sources:
      - https://justice.sec.gouv.sn/wp-content/uploads/textes-reglements/OHADA/Acte-uniforme-relatif-droit-arbitrage-jo-special-15-dec-2017.pdf
    notes: >-
      The Journal Officiel special edition of 15 December 2017 carries BOTH the
      arbitration act and the mediation act. This single PDF therefore likely
      contains two acts, and the parser must not merge them -- article numbering
      restarts at 1, which the gap check would report as a duplicate rather than
      a gap. Handle before ingesting AUM-2017 from the same file.

