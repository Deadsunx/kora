# OHADA Actes uniformes -- corpus manifest.
#
# This file is the single source of truth for what the corpus contains. It is
# versioned in git even though `data/` is not, because the *description* of the
# corpus is part of the method, while the bytes are reproducible from it.
#
# ---------------------------------------------------------------------------
# On the `status` field
# ---------------------------------------------------------------------------
# OHADA publishes revised acts that repeal earlier ones, and the download index
# lists both. A legal assistant that answers from a repealed act is worse than
# one that answers nothing, so status is tracked explicitly and carried through
# to every chunk.
#
#   in_force    -- current text, safe to cite
#   superseded  -- repealed by a later act; retained deliberately
#
# Superseded acts are ingested on purpose, for two reasons:
#   1. They are the ideal distractor set. A retriever that cannot tell the 1997
#      AUSCGIE from the 2014 one will be caught by the evaluation instead of
#      being caught by a user.
#   2. Questions about the *history* of a provision are legitimate, and answering
#      them requires the old text.
#
# NOTE: status here is derived from OHADA's own publication list (a revised act
# of the same scope repeals its predecessor). It is a research-grade annotation,
# not legal advice, and is asserted as such in the generated answers.

# ---------------------------------------------------------------------------
# On sources
# ---------------------------------------------------------------------------
# There is no single host that serves every act to an automated client:
#   - ohada.com          requires a login (returns an HTML sign-in page)
#   - droit-afrique.com  returns 403 to any non-browser user agent
# so the corpus is assembled from national government portals, which publish the
# Journal Officiel texts openly. Each document therefore carries its own ordered
# list of candidate URLs rather than sharing a template, and the downloader
# falls through the list until one returns real PDF bytes.
#
# `url_template` is retained only as a last-resort fallback for documents whose
# source has not been located yet.

version: 1
source_index: https://www.ohada.com/textes-ohada/actes-uniformes.html
url_template: https://www.ohada.com/telechargement/actes-uniformes/{id}_fr.pdf
language: fr

# Mirrors the ohada.com download set under the same {id}_fr.pdf naming, without
# the sign-in wall. Verified to serve all 11 in-force acts; it does not carry
# the 7 repealed ones, which simply 404 and fall through to the per-document
# sources below.
#
# Preferred over the government portals so the corpus is single-sourced: one
# host means one PDF toolchain and one set of layout quirks, which keeps parser
# behaviour comparable across acts instead of varying per document. The portals
# remain listed as fallbacks -- reproducibility should not depend on one site
# staying up.
mirror_templates:
  - https://jurisprudence-ohada.com/wp-content/uploads/2024/08/{id}_fr.pdf

documents:
  # -- Currently in force ---------------------------------------------------

  - id: AUPSRVE-2023
    abbrev: AUPSRVE
    year: 2023
    adopted: 2023-10-17
    title: >-
      Acte uniforme portant organisation des procédures simplifiées de
      recouvrement et des voies d'exécution
    domain: recouvrement et exécution
    status: in_force
    supersedes: AUPSRVE-1998
    prefer_sources: true
    sources:
      # SenegalLII (AfricanLII / Laws.Africa), CC-BY-4.0. Typeset by Laws.Africa
      # from structured Akoma Ntoso rather than scanned, so unlike the mirror
      # copy it carries a real text layer. Listed first via prefer_sources
      # because the mirror serves a scan here: a valid PDF the downloader
      # accepts and the parser then correctly refuses.
      - https://senlii.org/akn/aa-ohada/act/2023/organisation-des-proc%C3%A9dures-simplifi%C3%A9es-de-recouvrement-et-des-voies-d-ex%C3%A9cution/fra@2024-07-02/source.pdf
      # OHADA Journal Officiel special issue of 15 November 2023.
      - https://www.ohada.com/uploads/actualite/7010/J.O._special_AUVE_15.11.2023.pdf
      # Version unverified: this URL carries no year and both the 1998 and 2023
      # texts exist. Kept last for that reason.
      - https://justice.sec.gouv.sn/wp-content/uploads/textes-reglements/OHADA/Acte-uniforme-portant-organisation-des-procedures-simplifiees-de-recouvrement-et-des-voies-dexecution-.pdf
    notes: >-
      The most-litigated act in OHADA law, and the headline comparison for the
      parser: the reference dataset extracts 242 articles against roughly 335
      official, having lost article boundaries to a two-column layout. Its
      adoption date must be confirmed inside whichever PDF is used, since
      mislabelling the 1998 text as in force is exactly the error the status
      field exists to prevent.

