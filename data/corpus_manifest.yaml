      # Congo, Secretariat General du Gouvernement. Smallest file (637 KB) of
      # the three, which usually means a real text layer rather than a scan.
      - https://www.sgg.cg/txts-droit-reg/OHADA-Acte-uniforme-2014-societes-commerciales-gie.pdf
      # Senegal, Ministere de la Justice -- Journal Officiel of 2014-02-04.
      - https://justice.sec.gouv.sn/wp-content/uploads/textes-reglements/OHADA/Acte-uniforme-relatif-droit-societes-commerciales-gie-auscgie-jo-fevrier-2014.pdf
      # Cameroon eRegulations. 4.2 MB for the same act: almost certainly a scan,
      # kept last as an OCR fallback only.
      - https://garoua.eregulations.org/media/OHADA%202014_1.pdf
    notes: >-
      Largest act in the corpus and the most likely subject of user questions
      (company formation, governance, capital). Expect it to dominate retrieval.
      1392 articles according to the Maathis-com/ohada-actes-uniformes dataset,
      which is the reference our parser is measured against.

