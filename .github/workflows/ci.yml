name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Only the core package plus dev tools. No torch, no models, no GPU --
      # CI must stay fast enough that you actually keep it green. The heavy
      # stacks are exercised locally and in the experiment runs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=kora --cov-report=term-missing -m "not slow and not gpu"
